[package]
name = "koko-web"
description = "Koko web client (Rust → WASM, Leptos) reusing koko-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
koko-protocol = { workspace = true }
koko-core = { workspace = true }
leptos = { version = "0.6", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "Window",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
] }

[lints]
workspace = true
