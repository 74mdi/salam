[package]
name = "koko-client"
description = "Koko native client (iced): offline-first chat with a local SQLite mirror"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "koko"
path = "src/main.rs"

[features]
# The software renderer is useful as an explicit fallback, but makes the
# desktop UI noticeably sluggish while scrolling or typing.
default = ["wgpu"]
# GPU renderer for desktop/Android production builds.
wgpu = ["iced/wgpu", "koko-ui/wgpu"]

[dependencies]
koko-protocol = { workspace = true }
koko-core = { workspace = true }
koko-ui = { workspace = true }
iced = { version = "0.13", default-features = false, features = ["tokio", "tiny-skia", "image", "svg"] }
tokio = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
rusqlite = { workspace = true }
rand = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rfd = "0.15"
image = "0.24"

[dev-dependencies]

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Koko contributors"
copyright = "2026, Koko contributors"
license-file = ["../LICENSE", "0"]
depends = "$auto"
section = "net"
priority = "optional"
assets = [
	["target/release/koko", "usr/bin/", "755"],
	["../packaging/koko.desktop", "usr/share/applications/", "644"],
	["../packaging/koko.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
	["../README.md", "usr/share/doc/koko-client/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Koko desktop chat client"
assets = [
	{ source = "../target/release/koko", dest = "/usr/bin/koko", mode = "755" },
	{ source = "../packaging/koko.desktop", dest = "/usr/share/applications/koko.desktop", mode = "644" },
	{ source = "../packaging/koko.svg", dest = "/usr/share/icons/hicolor/scalable/apps/koko.svg", mode = "644" },
	{ source = "../README.md", dest = "/usr/share/doc/koko-client/README.md", mode = "644", doc = true },
	{ source = "../LICENSE", dest = "/usr/share/licenses/koko-client/LICENSE", mode = "644", doc = true },
]
