[workspace]
resolver = "2"
members = [
    "koko-protocol",
    "koko-core",
    "koko-db",
    "koko-server",
    "koko-ui",
    "koko-client",
    "koko-web",
]
# `cargo build` / `cargo test` at the repo root only builds the server stack
# (fast, no GUI toolchains). Build everything with `--workspace`.
default-members = [
    "koko-protocol",
    "koko-core",
    "koko-db",
    "koko-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/koko-chat/koko"
rust-version = "1.82"

[workspace.dependencies]
koko-protocol = { path = "koko-protocol" }
koko-core = { path = "koko-core" }
koko-db = { path = "koko-db" }
koko-ui = { path = "koko-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "3.0"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
actix-web = "4"
actix-ws = "0.3"
actix-files = "0.6"
mime = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
# Doc-comment shape lints: noise for a crate this size, reviewed manually.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# i64 (SQLite) ↔ u64 (protocol) conversions are guarded at every boundary.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
