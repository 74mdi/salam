name: deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy koko-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: koko-site/package-lock.json

      - name: Install dependencies
        working-directory: koko-site
        run: npm ci

      - name: Build static site
        working-directory: koko-site
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: koko-site/out

      - name: Explain skipped deployment
        if: steps.pages.outcome == 'failure'
        run: |
          echo "The static site was built, but this workflow token cannot enable GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
          echo "An administrator must enable Pages with GitHub Actions in repository settings; a later push will deploy it." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
