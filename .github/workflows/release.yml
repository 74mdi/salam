name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- server binaries ---------------------------------------------------
  server-linux:
    name: koko-server (linux x86_64, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p koko-server
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/koko-server dist/
          cp README.md LICENSE dist/
          tar -czf koko-server-linux-amd64.tar.gz -C dist .
          sha256sum koko-server-linux-amd64.tar.gz > koko-server-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: koko-server-linux-amd64
          path: |
            koko-server-linux-amd64.tar.gz
            koko-server-linux-amd64.tar.gz.sha256

  server-windows:
    name: koko-server (windows x86_64, release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p koko-server
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/koko-server.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath koko-server-windows-amd64.zip
          (Get-FileHash koko-server-windows-amd64.zip -Algorithm SHA256).Hash.ToLower() | Out-File koko-server-windows-amd64.zip.sha256 -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: koko-server-windows-amd64
          path: |
            koko-server-windows-amd64.zip
            koko-server-windows-amd64.zip.sha256

  server-macos:
    name: koko-server (macos aarch64, release)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p koko-server
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/koko-server dist/
          cp README.md LICENSE dist/
          tar -czf koko-server-macos-arm64.tar.gz -C dist .
          shasum -a 256 koko-server-macos-arm64.tar.gz > koko-server-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: koko-server-macos-arm64
          path: |
            koko-server-macos-arm64.tar.gz
            koko-server-macos-arm64.tar.gz.sha256

  # ---- native client (iced, wgpu renderer for production) ---------------
  client-linux:
    name: koko-client (linux x86_64, release + wgpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install iced system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - name: Install package builders
        run: |
          cargo install --locked cargo-deb
          cargo install --locked cargo-generate-rpm
      - name: Build
        run: cargo build --release -p koko-client --features wgpu
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/koko dist/
          cp README.md LICENSE dist/
          tar -czf koko-client-linux-amd64.tar.gz -C dist .
          sha256sum koko-client-linux-amd64.tar.gz > koko-client-linux-amd64.tar.gz.sha256
      - name: Build Debian and RPM packages
        working-directory: koko-client
        run: |
          cargo deb --no-build
          cargo generate-rpm
          cp ../target/debian/*.deb ../koko-client-linux-amd64.deb
          rpm_package=$(find target/generate-rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$rpm_package"
          cp "$rpm_package" ../koko-client-linux-x86_64.rpm
      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp target/release/koko AppDir/usr/bin/koko
          PATH="$PWD:$PATH" APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/koko \
            --desktop-file packaging/koko.desktop \
            --icon-file packaging/koko.svg \
            --output appimage
          appimage=$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy*' -print -quit)
          test -n "$appimage"
          mv "$appimage" koko-client-linux-x86_64.AppImage
      - name: Create package checksums
        run: |
          sha256sum koko-client-linux-amd64.deb > koko-client-linux-amd64.deb.sha256
          sha256sum koko-client-linux-x86_64.rpm > koko-client-linux-x86_64.rpm.sha256
          sha256sum koko-client-linux-x86_64.AppImage > koko-client-linux-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: koko-client-linux-amd64
          path: |
            koko-client-linux-amd64.tar.gz
            koko-client-linux-amd64.tar.gz.sha256
            koko-client-linux-amd64.deb
            koko-client-linux-amd64.deb.sha256
            koko-client-linux-x86_64.rpm
            koko-client-linux-x86_64.rpm.sha256
            koko-client-linux-x86_64.AppImage
            koko-client-linux-x86_64.AppImage.sha256

  client-windows:
    name: koko-client (windows x86_64, release + wgpu)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p koko-client --features wgpu
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/koko.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath koko-client-windows-amd64.zip
          (Get-FileHash koko-client-windows-amd64.zip -Algorithm SHA256).Hash.ToLower() | Out-File koko-client-windows-amd64.zip.sha256 -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: koko-client-windows-amd64
          path: |
            koko-client-windows-amd64.zip
            koko-client-windows-amd64.zip.sha256

  client-macos:
    name: koko-client (macos aarch64, release + wgpu)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p koko-client --features wgpu
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/koko dist/
          cp README.md LICENSE dist/
          tar -czf koko-client-macos-arm64.tar.gz -C dist .
          shasum -a 256 koko-client-macos-arm64.tar.gz > koko-client-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: koko-client-macos-arm64
          path: |
            koko-client-macos-arm64.tar.gz
            koko-client-macos-arm64.tar.gz.sha256

  # ---- web client bundle --------------------------------------------------
  web:
    name: koko-web (trunk release bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.7/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/
      - name: Build
        working-directory: koko-web
        run: trunk build --release
      - name: Package
        run: |
          tar -czf koko-web.tar.gz -C koko-web/dist .
          sha256sum koko-web.tar.gz > koko-web.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: koko-web
          path: |
            koko-web.tar.gz
            koko-web.tar.gz.sha256

  # ---- publish the GitHub Release ----------------------------------------
  publish:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - server-linux
      - server-windows
      - server-macos
      - client-linux
      - client-windows
      - client-macos
      - web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.sha256
