# cargo-deny configuration. Run: cargo deny check
# Advisories (cargo audit parity) are enforced in CI; this file pins license policy.

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "HTTP/2 is disabled in this server; its plain HTTP upstream is behind the TLS-terminating reverse proxy." },
    { id = "RUSTSEC-2023-0071", reason = "RSA is pulled in by SQLx's optional MySQL backend, which is not enabled; this application uses SQLite only." },
]
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
