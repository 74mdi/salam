# cargo-deny configuration. Run: cargo deny check
# Advisories (cargo audit parity) are enforced in CI; this file pins license policy.

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "HTTP/2 is disabled in this server; its plain HTTP upstream is behind the TLS-terminating reverse proxy." },
    { id = "RUSTSEC-2023-0071", reason = "RSA is pulled in by SQLx's optional MySQL backend, which is not enabled; this application uses SQLite only." },
    { id = "RUSTSEC-2025-0141", reason = "Bincode 1 is the current wire format; replacing it requires an explicitly versioned protocol migration." },
    { id = "RUSTSEC-2024-0384", reason = "Maintenance-only advisory in a transitive desktop GUI dependency; cargo audit continues to deny active vulnerabilities." },
    { id = "RUSTSEC-2024-0436", reason = "Maintenance-only advisory in a transitive desktop GUI dependency; cargo audit continues to deny active vulnerabilities." },
    { id = "RUSTSEC-2026-0441", reason = "Maintenance-only advisory in a transitive desktop GUI dependency; cargo audit continues to deny active vulnerabilities." },
    { id = "RUSTSEC-2024-0370", reason = "Maintenance-only advisory in transitive GUI procedural macros; cargo audit continues to deny active vulnerabilities." },
    { id = "RUSTSEC-2026-0173", reason = "Maintenance-only advisory in transitive GUI procedural macros; cargo audit continues to deny active vulnerabilities." },
    { id = "RUSTSEC-2026-0206", reason = "Maintenance-only advisory in the transitive iced text-rendering stack; replacing it requires upstream rendering changes." },
    { id = "RUSTSEC-2026-0192", reason = "Maintenance-only advisory in the transitive iced font stack; replacing it requires upstream rendering changes." },
    { id = "RUSTSEC-2026-0371", reason = "Maintenance-only advisory in zbus 5 used by the desktop file-picker portal; migration requires upstream portal support." },
    { id = "RUSTSEC-2026-0370", reason = "Maintenance-only advisory in zbus 5 used by the desktop file-picker portal; migration requires upstream portal support." },
    { id = "RUSTSEC-2026-0372", reason = "Maintenance-only advisory in zbus 5 used by the desktop file-picker portal; migration requires upstream portal support." },
]
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
