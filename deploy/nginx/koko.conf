# koko behind nginx — WebSocket upgrade + TLS termination.
# Drop into /etc/nginx/sites-available/koko and symlink into sites-enabled.

server {
    listen 443 ssl http2;
    server_name koko.example.com;

    ssl_certificate     /etc/letsencrypt/live/koko.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koko.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade (required for /ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Media uploads up to 25 MiB + slack.
        client_max_body_size 30m;
    }
}

server {
    listen 80;
    server_name koko.example.com;
    return 301 https://$host$request_uri;
}
